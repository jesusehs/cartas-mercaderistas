# Supabase (plan gratis) pausa el proyecto tras 7 días sin uso.
# Este flujo hace una consulta cada 3 días para mantenerlo activo,
# y una vez al mes deja un commit para que GitHub no apague el flujo.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 13 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/config?select=clave&limit=1" -H "apikey: $KEY")
          echo "Supabase respondió HTTP $code"
      - name: Commit mensual
        run: |
          ultimo=$(git log -1 --format=%ct); ahora=$(date +%s)
          if [ $(( (ahora - ultimo) / 86400 )) -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/ultimo-ping.txt
            git config user.name "mantener-activo"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ultimo-ping.txt
            git commit -m "Mantener activo"
            git push
          fi
