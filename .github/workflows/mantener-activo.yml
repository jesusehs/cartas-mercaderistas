# Supabase (plan gratis) pausa el proyecto tras 7 días sin uso.
# Este flujo llama a la función ping() de la base cada 2 días para mantenerlo activo,
# y una vez al mes deja un commit para que GitHub no apague el flujo.
# Si la base no responde 200, el flujo falla y GitHub avisa por correo.
name: Mantener Supabase activo
on:
  schedule:
    - cron: '17 13 */2 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Consultar Supabase
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js)
          for intento in 1 2 3; do
            code=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
              -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' || true)
            echo "Intento $intento: Supabase respondió HTTP $code $(cat respuesta.txt 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase no respondió bien (HTTP $code). Si el proyecto está pausado, reactívalo en supabase.com (Resume project)."
          exit 1
      - name: Commit mensual
        if: always()
        run: |
          ultimo=$(git log -1 --format=%ct); ahora=$(date +%s)
          if [ $(( (ahora - ultimo) / 86400 )) -ge 30 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/ultimo-ping.txt
            git config user.name "mantener-activo"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ultimo-ping.txt
            git commit -m "Mantener activo"
            git push
          fi
